<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animated book — prototype</title>
<style>
  html,body{margin:0;height:100%;background:#e9e2d2;font:18px/1.5 Georgia,"Times New Roman",serif;color:#2b2b2b;overflow:hidden}
  .stage{position:relative;width:440px;height:700px;margin:22px auto 0;perspective:1600px}
  .sheet{position:absolute;inset:0;background:#fffdf7;border-radius:6px;box-shadow:0 3px 14px #0003;padding:18px;
    box-sizing:border-box;transform-origin:left center;backface-visibility:hidden;display:flex;flex-direction:column}
  .sheet.in{animation:turnIn .9s ease-out both}
  .sheet.out{animation:turnOut .9s ease-in both}
  @keyframes turnIn{from{transform:rotateY(35deg) translateX(30px);opacity:0}to{transform:none;opacity:1}}
  @keyframes turnOut{to{transform:rotateY(-100deg);opacity:0;box-shadow:0 3px 30px #0005}}
  .art svg{width:100%;height:auto;display:block;border-radius:4px}
  .art details,.art p,.art button{display:none}
  .text{margin:16px 6px 0;min-height:7.5em}
  .text span{opacity:0;transition:opacity .9s ease}
  .text span.on{opacity:1}
  .num{margin-top:auto;text-align:center;color:#8a8170;font-size:14px}
  .cover h1{font-size:30px;line-height:1.2;text-align:center;margin:10px 0 6px}
  .cover .by,.end .credit{text-align:center;color:#6b6252;font:13px/1.45 system-ui,sans-serif;margin:0 10px 14px}
  .end{justify-content:center;align-items:center;text-align:center}
  .end h2{font-size:40px;font-weight:normal;margin:0 0 18px;opacity:0;animation:fade 1.4s ease .5s forwards}
  .end .credit{opacity:0;animation:fade 1.2s ease 1.6s forwards}
  @keyframes fade{to{opacity:1}}
  .tag{position:fixed;left:0;right:0;bottom:6px;text-align:center;font:11px system-ui;color:#7a705e}
</style></head><body>
<div class="stage" id="stage"></div>
<div class="tag">Prototype · story and page plans: real Qwen3-1.7B output · pictures placed, drawn and animated by the page</div>
<script type="module">
import { renderSketch, loadRough, loadArt, readDrawing } from "/web/sketch.mjs?v=9";
import { composeScene } from "/web/scene.mjs?v=9";
import { parseStory, fixPagePlan, coverPlan, wordsOnlyPlan } from "/web/book.mjs?v=9";
import { animatePicture } from "/web/animate.mjs";

const q = new URLSearchParams(location.search);
const book = await (await fetch(`/books/${q.get("book") || "dog-shaped"}.json`)).json();
const story = parseStory(book.story);
const rough = await loadRough("/web/rough.mjs"), art = await loadArt("/web/art.mjs");
const stage = document.getElementById("stage");
const wait = ms => new Promise(r => setTimeout(r, ms));
const draw = (box, title, entries) => {
  const c = composeScene({ t: title, c: entries });
  renderSketch(box, JSON.stringify({ t: c.t, c: c.c }), { rough, art, spread: false, scenery: true });
  return box.querySelector("svg");
};

// Every page is planned and drawn up front, as the app does while writing.
// ?phone=1 draws each picture from its page's words, as the app does on a phone.
const phone = q.has("phone");
const plans = story.pages.map((text, i) => {
  if (phone) return wordsOnlyPlan(text, story).entries;
  let entries = []; try { entries = readDrawing(book.plans[i]).c; } catch {}
  return fixPagePlan(entries, text, story).entries;
});
// Frames per second while the pages play, for judging a slow device.
const frames = []; let last = performance.now();
(function tick(t) { frames.push(t - last); last = t; if (!window.__done) requestAnimationFrame(tick); })(last);
window.__fps = () => { const f = frames.slice(30); const avg = f.reduce((a, b) => a + b, 0) / f.length;
  const slow = f.filter(x => x > 50).length; return { fps: Math.round(1000 / avg), framesOver50ms: slow, frames: f.length }; };

let current = null, motion = null;
async function show(sheet, hold) {
  stage.append(sheet);
  if (current) { current.classList.add("out"); const old = current; setTimeout(() => old.remove(), 950); }
  if (motion) motion.stop();
  sheet.classList.add("in");
  current = sheet;
}
const decided = [];

// Cover
const cover = document.createElement("div"); cover.className = "sheet cover";
cover.innerHTML = `<h1></h1><p class="by">Written by a small language model on this device · illustrated by the page</p><div class="art"></div>`;
cover.querySelector("h1").textContent = story.title;
const coverSvg = draw(cover.querySelector(".art"), story.title + " " + story.pages[0], coverPlan(story, plans[0]));
await show(cover);
motion = animatePicture(coverSvg, { text: "", story });
await wait(4200);

// Pages: the page turns, the picture arrives thing by thing, then the words,
// one sentence at a time; the characters act out what the words say.
for (const [i, text] of story.pages.entries()) {
  const s = document.createElement("div"); s.className = "sheet";
  s.innerHTML = `<div class="art"></div><p class="text"></p><div class="num">— ${i + 1} —</div>`;
  const svg = draw(s.querySelector(".art"), text, plans[i]);
  const sentences = text.split(/(?<=[.!?])\s+/);
  const p = s.querySelector(".text");
  for (const t of sentences) { const span = document.createElement("span"); span.textContent = t + " "; p.append(span); }
  await show(s);
  motion = animatePicture(svg, { text, story });
  decided.push({ page: i + 1, drawn: plans[i], moves: motion.said });
  await wait(900);
  for (const span of p.children) { span.classList.add("on"); await wait(1100 + span.textContent.split(" ").length * 70); }
  await wait(2200);
}

// The end
const end = document.createElement("div"); end.className = "sheet end";
end.innerHTML = `<h2>The End</h2><p class="credit">Story by a language model running in this browser<br>pictures placed and drawn by sketchgpt<br>illustrations from Twemoji (CC-BY 4.0) · inference by WebLLM</p>`;
await show(end);
await wait(4000);
window.__said = decided;
window.__done = true;
</script></body></html>
