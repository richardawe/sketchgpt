<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sketchgpt</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E2%9C%8F%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #fbfbfa;       --panel: #ffffff;   --ink: #1a1a18;
    --muted: #6b6b66;    --line: #e4e4e0;    --accent: #2f6f4f;
    --user-bg: #eef2f0;  --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16161a;     --panel: #1e1e23;   --ink: #e8e8e4;
      --muted: #9a9a94;  --line: #2f2f36;    --accent: #7fd1a6;
      --user-bg: #26262d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--accent); }
  .dot.err { background: #c0503f; }
  #status { color: var(--muted); font-size: 13px; }
  .spacer { flex: 1 1 auto; }
  select, button, input, textarea {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  #settings {
    padding: 12px 16px; border-bottom: 1px solid var(--line);
    background: var(--panel); display: none;
  }
  #settings.open { display: block; }
  #settings label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  #system { width: 100%; min-height: 70px; resize: vertical; }
  .row { display: flex; gap: 16px; align-items: center; margin-top: 10px; flex-wrap: wrap; font-size: 13px; }
  #log { flex: 1 1 auto; overflow-y: auto; padding: 20px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .msg { margin-bottom: 18px; }
  .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
  .body { white-space: pre-wrap; word-wrap: break-word; }
  .msg.user .body {
    background: var(--user-bg); padding: 10px 12px; border-radius: var(--radius);
  }
  .think {
    font-size: 13px; color: var(--muted); border-left: 2px solid var(--line);
    padding-left: 10px; margin-bottom: 8px; font-style: italic; white-space: pre-wrap;
  }
  .empty { color: var(--muted); text-align: center; margin-top: 12vh; }
  .empty code { background: var(--user-bg); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 16px; }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  #input { flex: 1; resize: none; max-height: 180px; }
  .err {
    max-width: 760px; margin: 0 auto 14px; padding: 10px 12px; border-radius: var(--radius);
    background: #c0503f18; border: 1px solid #c0503f55; font-size: 14px;
  }
  @media (max-width: 600px) { #log, header, footer, #settings { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>sketchgpt</h1>
  <select id="model" title="Model"></select>
  <span id="status">connecting…</span>
  <span class="spacer"></span>
  <button id="toggle">Settings</button>
  <button id="clear">Clear</button>
</header>

<div id="settings">
  <div class="wrap">
    <label for="system">System prompt — the cheapest way to change what the model does</label>
    <textarea id="system" placeholder="e.g. You are a terse assistant that describes drawings in one sentence."></textarea>
    <div class="row">
      <span><label for="temp" style="display:inline">Temperature</label>
        <input id="temp" type="number" min="0" max="2" step="0.1" value="0.8" style="width:70px"></span>
      <label style="display:inline"><input type="checkbox" id="think"> show reasoning</label>
      <span id="hint" style="color:var(--muted)"></span>
    </div>
  </div>
</div>

<div id="log"><div class="wrap"><div class="empty">
  Talk to your local model.<br><code>qwen3:0.6b</code> runs entirely on this machine.
</div></div></div>

<footer>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Send a message…  (Enter to send, Shift+Enter for newline)"></textarea>
    <button type="submit" id="send">Send</button>
    <button type="button" id="stop" style="display:none">Stop</button>
  </form>
</footer>

<script>
const API = location.hostname === "localhost" || location.hostname === "127.0.0.1"
  ? `http://${location.hostname}:11434`
  : "http://127.0.0.1:11434";

const $ = id => document.getElementById(id);
const log = $("log").firstElementChild;
let history = [];
let controller = null;

function setStatus(text, state) {
  $("status").textContent = text;
  $("dot").className = "dot" + (state ? " " + state : "");
}

function showError(html) {
  const d = document.createElement("div");
  d.className = "err";
  d.innerHTML = html;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}

async function connect() {
  try {
    const r = await fetch(`${API}/api/tags`);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const { models } = await r.json();
    if (!models || !models.length) {
      setStatus("no models", "err");
      showError("No models installed. Run <code>scripts/setup-ollama.sh</code> to pull one.");
      return;
    }
    $("model").innerHTML = "";
    for (const m of models) {
      const o = document.createElement("option");
      o.value = o.textContent = m.name;
      $("model").appendChild(o);
    }
    const pinned = [...$("model").options].find(o => o.value.startsWith("qwen3"));
    if (pinned) $("model").value = pinned.value;
    setStatus("connected", "on");
  } catch (e) {
    setStatus("offline", "err");
    showError(
      `Can't reach Ollama at <code>${API}</code>.<br>` +
      `Start it with <code>scripts/setup-ollama.sh</code>, then reload.` +
      (location.protocol === "file:"
        ? `<br><br><b>You opened this file directly.</b> Ollama rejects <code>file://</code> pages. ` +
          `Serve it instead: <code>scripts/serve-web.sh</code>`
        : "")
    );
  }
}

function addMsg(role, text) {
  if (log.querySelector(".empty")) log.innerHTML = "";
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = `<div class="who">${role === "user" ? "you" : "sketchgpt"}</div>`;
  const think = document.createElement("div");
  think.className = "think";
  think.style.display = "none";
  const body = document.createElement("div");
  body.className = "body";
  body.textContent = text || "";
  el.append(think, body);
  log.appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
  return { body, think };
}

async function send(text) {
  addMsg("user", text);
  history.push({ role: "user", content: text });

  const out = addMsg("assistant", "");
  const showThink = $("think").checked;
  controller = new AbortController();
  $("send").disabled = true;
  $("stop").style.display = "";

  const messages = [...history];
  const sys = $("system").value.trim();
  if (sys) messages.unshift({ role: "system", content: sys });

  let full = "", thinking = "";
  try {
    const res = await fetch(`${API}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: controller.signal,
      body: JSON.stringify({
        model: $("model").value,
        messages,
        stream: true,
        think: showThink,
        options: { temperature: parseFloat($("temp").value) || 0 }
      })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${await res.text()}`);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        let j;
        try { j = JSON.parse(line); } catch { continue; }
        if (j.error) throw new Error(j.error);
        const m = j.message || {};
        if (m.thinking) {
          thinking += m.thinking;
          out.think.style.display = "";
          out.think.textContent = thinking;
        }
        if (m.content) {
          full += m.content;
          out.body.textContent = full;
        }
        $("log").scrollTop = $("log").scrollHeight;
      }
    }
    history.push({ role: "assistant", content: full });
  } catch (e) {
    if (e.name === "AbortError") {
      out.body.textContent = full + "\n\n[stopped]";
      history.push({ role: "assistant", content: full });
    } else {
      out.body.remove();
      showError("Request failed: " + e.message);
      history.pop();
    }
  } finally {
    controller = null;
    $("send").disabled = false;
    $("stop").style.display = "none";
    $("input").focus();
  }
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const v = $("input").value.trim();
  if (!v || controller) return;
  $("input").value = "";
  $("input").style.height = "auto";
  send(v);
});

$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
$("input").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 180) + "px";
});
$("stop").addEventListener("click", () => controller && controller.abort());
$("toggle").addEventListener("click", () => $("settings").classList.toggle("open"));
$("clear").addEventListener("click", () => {
  history = [];
  log.innerHTML = '<div class="empty">Cleared. Say something.</div>';
});

// Persist the system prompt across reloads; harmless if storage is unavailable.
try {
  const saved = localStorage.getItem("sketchgpt.system");
  if (saved) $("system").value = saved;
  $("system").addEventListener("input", () => {
    try { localStorage.setItem("sketchgpt.system", $("system").value); } catch {}
  });
} catch {}

connect();
$("input").focus();
</script>
</body>
</html>
