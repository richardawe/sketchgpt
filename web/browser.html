<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- interactive-widget: when the on-screen keyboard opens, resize the layout
     instead of scrolling it, so the composer stays above the keyboard. -->
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>sketchgpt in-browser</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E%E2%9C%8F%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #fbfbfa;       --panel: #ffffff;   --ink: #1a1a18;
    --muted: #6b6b66;    --line: #e4e4e0;    --accent: #2f6f4f;
    --user-bg: #eef2f0;  --radius: 10px;  --code-bg: #f1f1ee;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16161a;     --panel: #1e1e23;   --ink: #e8e8e4;
      --muted: #9a9a94;  --line: #2f2f36;    --accent: #7fd1a6;
      --user-bg: #26262d; --code-bg: #26262d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column;
    /* 100vh on a phone is the viewport with the URL bar HIDDEN, so the footer
       sat below the fold until you dragged the page and collapsed the bar.
       dvh tracks the area actually visible. vh stays as the fallback for
       browsers without dvh, where the old behaviour is no worse than before. */
    height: 100vh;
    height: 100dvh;
  }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--accent); }
  .dot.err { background: #c0503f; }
  .dot.busy { background: #d9a441; }
  #status { color: var(--muted); font-size: 13px; }
  /* A constrained preset silently rewrites every reply, so it must be visible
     even when the settings panel is shut. */
  #mode { font-size: 12px; padding: 2px 8px; border-radius: 999px;
          background: var(--accent); color: #fff; white-space: nowrap; }
  #mode[hidden] { display: none; }
  .spacer { flex: 1 1 auto; }
  select, button, input, textarea {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  }
  button { cursor: pointer; }
  /* Long option labels give the select a wide intrinsic width, which pushed the
     page into horizontal scroll on a phone. Cap it and let the text truncate. */
  #model { max-width: 100%; min-width: 0; text-overflow: ellipsis; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: 0.5; cursor: default; }
  #bar { height: 3px; background: var(--line); display: none; }
  #bar.on { display: block; }
  #barfill { height: 100%; width: 0; background: var(--accent); transition: width 0.25s; }
  #settings { padding: 12px 16px; border-bottom: 1px solid var(--line);
              background: var(--panel); display: none; }
  #settings.open { display: block; }
  #settings label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  #system { width: 100%; min-height: 76px; resize: vertical; }
  #preset { width: 100%; max-width: 100%; }
  .row { display: flex; gap: 16px; align-items: center; margin-top: 10px;
         flex-wrap: wrap; font-size: 13px; }
  #log { flex: 1 1 auto; overflow-y: auto; padding: 20px 16px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .msg { margin-bottom: 18px; }
  /* Rendered Markdown inside an assistant message. Tight vertical rhythm:
     these are chat turns, not documents. */
  .body > :first-child { margin-top: 0; }
  .body > :last-child { margin-bottom: 0; }
  .body p { margin: 0 0 10px; }
  .body h1, .body h2, .body h3, .body h4, .body h5, .body h6 {
    margin: 16px 0 8px; line-height: 1.3; font-weight: 600;
  }
  .body h1 { font-size: 1.3em; } .body h2 { font-size: 1.18em; }
  .body h3 { font-size: 1.06em; } .body h4, .body h5, .body h6 { font-size: 1em; }
  .body ul, .body ol { margin: 0 0 10px; padding-left: 22px; }
  .body li { margin: 2px 0; }
  .body blockquote {
    margin: 0 0 10px; padding: 2px 0 2px 12px;
    border-left: 3px solid var(--line); color: var(--muted);
  }
  .body hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .body code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em;
    background: var(--code-bg); padding: 1px 5px; border-radius: 4px;
  }
  .body pre {
    margin: 0 0 10px; padding: 10px 12px; border-radius: var(--radius);
    background: var(--code-bg); overflow-x: auto;
  }
  .body pre code { background: none; padding: 0; font-size: 0.88em; }
  .body a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
  /* KaTeX may not have loaded; the source text is the fallback. */
  .body code.tex { color: var(--muted); }
  /* A long display formula scrolls rather than forcing the page sideways,
     which is what breaks a phone layout. */
  .body .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
  .body .katex { font-size: 1.05em; }
  .who { font-size: 12px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
  /* Plain text while streaming, and for the user's own messages, so newlines
     survive. `rich` is set once a message has been rendered as Markdown, where
     the markup carries the line breaks and pre-wrap would double them. */
  .body { white-space: pre-wrap; word-wrap: break-word; }
  .body.rich { white-space: normal; }
  .sketch svg { display: block; width: 100%; max-width: 400px; height: auto; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; }
  .msg.user .body { background: var(--user-bg); padding: 10px 12px; border-radius: var(--radius); }
  .think {
    font-size: 13px; color: var(--muted); border-left: 2px solid var(--line);
    padding-left: 10px; margin-bottom: 8px; font-style: italic; white-space: pre-wrap;
  }
  .card {
    max-width: 620px; margin: 8vh auto 0; padding: 22px;
    border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel);
  }
  .card h2 { margin: 0 0 8px; font-size: 17px; }
  .card p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .card .go { background: var(--accent); color: #fff; border-color: var(--accent); padding: 9px 18px; font-weight: 500; }
  .meta { font-size: 13px; color: var(--muted); margin-top: 14px; line-height: 1.8; }
  .meta b { color: var(--ink); font-weight: 600; }
  .err {
    max-width: 760px; margin: 0 auto 14px; padding: 10px 12px; border-radius: var(--radius);
    background: #c0503f18; border: 1px solid #c0503f55; font-size: 14px;
  }
  code { background: var(--user-bg); padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  footer {
    border-top: 1px solid var(--line); background: var(--panel); display: none;
    /* The inset keeps the composer clear of the iOS home indicator on browsers
       that report one; it resolves to 0 everywhere else. */
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  }
  footer.on { display: block; }
  form { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  /* rows="1" sizes the box to ONE line, so a placeholder that wraps to two is
     clipped — which on a phone reads as a broken input. Give it a floor that
     fits a line comfortably and let the autosize handler grow it from there. */
  #input { flex: 1; resize: none; min-height: 38px; max-height: 180px; overflow-y: auto; }
  /* iOS zooms the whole page in when a focused form control is under 16px,
     which pushes the layout wider than the screen and clips it on the right —
     the header and the answer text both. Nothing here is actually overflowing;
     the page is magnified. 16px on touch devices stops it. */
  @media (pointer: coarse) {
    select, button, input, textarea { font-size: 16px; }
    #input { min-height: 42px; }
  }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>sketchgpt</h1>
  <select id="model" title="Model"></select>
  <select id="output" aria-label="Output mode"><option value="chat">Chat</option><option value="sketch">Sketch</option></select>
  <span id="status">checking…</span>
  <span id="mode" hidden></span>
  <span class="spacer"></span>
  <button id="toggle">Settings</button>
  <button id="evict" title="Remove the cached weights from this browser">Clear cache</button>
</header>
<div id="bar"><div id="barfill"></div></div>

<div id="settings">
  <div class="wrap">
    <label for="preset">Preset</label>
    <select id="preset">
      <option value="chat">Chat — open conversation</option>
      <option value="concise">Concise — short answers</option>
      <option value="custom">Custom</option>
    </select>

    <label for="system" style="margin-top:12px">System prompt</label>
    <textarea id="system" placeholder="Instructions the model sees before every message."></textarea>

    <div class="row">
      <span><label for="temp" style="display:inline">Temperature</label>
        <input id="temp" type="number" min="0" max="2" step="0.1" value="0.7" style="width:70px"></span>
      <label style="display:inline" title="Send each message on its own, ignoring earlier turns">
        <input type="checkbox" id="single"> one message at a time</label>
      <label style="display:inline" title="Qwen3 and similar models reason before answering">
        <input type="checkbox" id="think"> show reasoning</label>
      <span id="hint" style="color:var(--muted)"></span>
    </div>
  </div>
</div>

<div id="log"><div class="wrap" id="wrap">
  <div class="card" id="card">
    <h2>Run the model in this tab</h2>
    <p>
      The weights download once from the Hugging Face CDN into this browser's
      cache, then inference runs locally on your GPU. No server, no install —
      and it keeps working offline afterwards.
    </p>
    <button class="go" id="load">Download &amp; load model</button>
    <div class="meta" id="meta"></div>
  </div>
</div></div>

<footer id="foot">
  <form id="form">
    <textarea id="input" rows="1" placeholder="Send a message…"></textarea>
    <button type="submit" id="send">Send</button>
    <button type="button" id="stop" style="display:none">Stop</button>
  </form>
</footer>

<script type="module">
import { SKETCH_PROMPT, SKETCH_SCHEMA, renderSketch } from "./sketch.mjs";
const LIB = new URLSearchParams(location.search).get("lib")
  || "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.85/+esm";

// A static import that fails kills the whole module silently, leaving the page
// stuck on "checking…". Load it dynamically so a blocked CDN is reportable.
let webllm;
try {
  webllm = await import(LIB);
} catch (e) {
  document.getElementById("wrap").innerHTML =
    '<div class="err"><b>Could not load the WebLLM library.</b><br><br>' +
    'The page needs to fetch it from a CDN on first load. Check your network ' +
    'or any extension blocking <code>cdn.jsdelivr.net</code>, then reload.<br><br>' +
    String(e && e.message || e) + '</div>';
  document.getElementById("status").textContent = "library unavailable";
  document.getElementById("dot").className = "dot err";
  throw e;
}

const $ = id => document.getElementById(id);

// ---- What a model actually costs ----------------------------------------
// Three different numbers, and the page used to conflate them:
//
//   download  bytes pulled over the network into browser storage. This is what
//             mobile data and the storage quota care about.
//   gpu       bytes the WebGPU device reserves. This is what kills the tab.
//   context   how much of `gpu` scales with the context window.
//
// WebLLM publishes `vram_required_MB`, which is NONE of them: nothing in
// WebLLM reads it, and it bakes in a workspace for `batch_verify`, a
// speculative-decoding entry point WebLLM never binds. On Qwen3-0.6B that
// makes it 43% too high, which is why this page used to refuse a model that
// fits comfortably.
//
// So budget from the parts instead. Measured against real allocation (see
// scripts/vram-probe/ and docs/mobile-models.md):
//
//   gpuMB(ctx) = paramsMB + kvPerTok * ctx / 1e6 + OVERHEAD_MB
//
// paramsMB and kvPerTok are read out of the `_metadata` blob inside each
// compiled wasm; kvPerTok already accounts for the build's KV dtype (f32 in a
// q4f32 build, f16 in a q4f16 one). Verified on three models across four
// context lengths, then used to predict a fourth to within 1% before measuring.
//
// wsMB is the largest workspace among the VM functions WebLLM *does* bind. It
// allocates on first inference, which has not been measured on real hardware
// yet, so it is added to the budget as a ceiling rather than ignored.
const OVERHEAD_MB = 23;

// Ordered smallest first within each tier. A model too big for the device does
// not throw — the browser kills the tab, which no try/catch can intercept — so
// the only defence is refusing to start one that will not fit.
//
// `tier` groups the dropdown by parameter scale. It is NOT a claim about which
// device can run what: that is computed per visitor from the numbers below, and
// shows up as the context annotation or a "too big" label on each option.
//
// No entry here carries a quality claim. The only models this project has
// actually measured for accuracy are in docs/customising.md, and the finding
// there is that at this size a confident wrong answer is the normal failure.
const MODELS = [
  // ---- under 1B parameters ----
  { id: "SmolLM2-135M-Instruct-q0f16-MLC",   label: "SmolLM2 135M (f16, not quantized)", tier: 0,
    downloadMB: 273, paramsMB: 269, kvPerTok: 23040,  wsMB: 13,
    note: "The only build here under 400 MB that is <b>not 4-bit</b> — these are full f16 weights. " +
          "Whether 135M undamaged beats 360M at 4-bit is an open question this page exists to let you test." },
  { id: "SmolLM2-135M-Instruct-q0f32-MLC",   label: "SmolLM2 135M (fp32, not quantized)", tier: 0,
    downloadMB: 273, paramsMB: 538, kvPerTok: 46080,  wsMB: 25,
    note: "Also <b>not 4-bit</b> — full fp32 weights. Same download as the f16 build; the extra " +
          "cost is entirely GPU memory." },
  { id: "SmolLM2-360M-Instruct-q4f16_1-MLC", label: "SmolLM2 360M — smallest 4-bit, best for phones", tier: 0,
    downloadMB: 207, paramsMB: 204, kvPerTok: 40960,  wsMB: 21 },
  { id: "SmolLM2-360M-Instruct-q4f32_1-MLC", label: "SmolLM2 360M (fp32)", tier: 0,
    downloadMB: 207, paramsMB: 226, kvPerTok: 81920,  wsMB: 42 },
  { id: "Qwen2.5-0.5B-Instruct-q4f16_1-MLC", label: "Qwen2.5 0.5B", tier: 0,
    downloadMB: 290, paramsMB: 278, kvPerTok: 12288,  wsMB: 118,
    note: "The cheapest context in this list — 12 KiB per token, so a long window costs almost nothing." },
  { id: "Qwen2.5-0.5B-Instruct-q4f32_1-MLC", label: "Qwen2.5 0.5B (fp32)", tier: 0,
    downloadMB: 290, paramsMB: 309, kvPerTok: 24576,  wsMB: 158,
    note: "The cheapest context in this list — a long window costs almost nothing." },
  { id: "Qwen3-0.6B-q4f16_1-MLC",            label: "Qwen3 0.6B — matches the Ollama setup", tier: 0,
    downloadMB: 352, paramsMB: 335, kvPerTok: 114688, wsMB: 122 },
  { id: "Qwen3-0.6B-q4f32_1-MLC",            label: "Qwen3 0.6B (fp32)", tier: 0,
    downloadMB: 352, paramsMB: 373, kvPerTok: 229376, wsMB: 162 },
  { id: "Qwen3.5-0.8B-q4f16_1-MLC",          label: "Qwen3.5 0.8B", tier: 0,
    downloadMB: 447, paramsMB: 424, kvPerTok: 12288,  wsMB: 410,
    note: "Hybrid attention — only 6 of its 24 layers keep a KV cache, so context is nearly free. " +
          "But its decode workspace is 410 MB, the largest of any model here, which is what keeps it " +
          "off phones despite the small download." },

  // ---- around 1B ----
  { id: "gemma3-1b-it-q4f16_1-MLC",          label: "Gemma 3 1B", tier: 1,
    downloadMB: 602, paramsMB: 563, kvPerTok: 26624,  wsMB: 74, slidingWindow: 512,
    note: "Released under the <b>Gemma licence</b>, not Apache-2.0 — check it before redistributing." },
  { id: "Llama-3.2-1B-Instruct-q4f16_1-MLC", label: "Llama 3.2 1B", tier: 1,
    downloadMB: 705, paramsMB: 695, kvPerTok: 32768,  wsMB: 88,
    note: "Llama 3.2 Community Licence. Measured better than SmolLM2-360M at extraction and routing, " +
          "and worse at sticking to a two-word output format." },
  { id: "OLMo-2-0425-1B-Instruct-q4f16_1-MLC", label: "OLMo 2 1B — fully open", tier: 1,
    downloadMB: 845, paramsMB: 835, kvPerTok: 131072, wsMB: 131,
    note: "Apache-2.0, and the training data and code are published too, which makes it the honest " +
          "baseline when comparing open models. Its KV cache is the most expensive here at 128 KiB/token." },

  // ---- 1.5B and up ----
  { id: "Qwen2.5-1.5B-Instruct-q4f16_1-MLC", label: "Qwen2.5 1.5B", tier: 2,
    downloadMB: 880, paramsMB: 869, kvPerTok: 28672,  wsMB: 173 },
  { id: "Qwen3-1.7B-q4f16_1-MLC",            label: "Qwen3 1.7B", tier: 2,
    downloadMB: 984, paramsMB: 968, kvPerTok: 114688, wsMB: 153,
    note: "Produced a genuine multi-chapter book outline on a desktop. This is where output stops " +
          "being a novelty." },
  { id: "SmolLM2-1.7B-Instruct-q4f16_1-MLC", label: "SmolLM2 1.7B", tier: 2,
    downloadMB: 966, paramsMB: 963, kvPerTok: 196608, wsMB: 88,
    note: "No grouped-query attention at all — 192 KiB per token, so its cache costs more than its " +
          "weights at a full context window." }
];

const TIERS = ["Under 1B parameters", "Around 1B", "1.5B and up — desktop"];

// The compiled shader library is fetched alongside the weights.
const WASM_MB = 6;

// Rungs to try, largest first. 1024 is the floor: below that the model cannot
// hold a system prompt and a couple of turns, so a smaller model is the better
// trade.
const CTX_LADDER = [4096, 2048, 1024];

// Never default to a model sitting at the very top of the budget: that is how
// a tab gets killed. Everything is chosen against budget * HEADROOM.
const HEADROOM = 0.7;

const modelOf = id => MODELS.find(m => m.id === id);

// Total bytes this model pulls over the network on a cold load.
const downloadOf = id => { const m = modelOf(id); return m ? m.downloadMB + WASM_MB : null; };

// A sliding window caps the KV cache regardless of the requested context, so
// gemma3 costs the same at 4096 as at 1024.
const kvTokensFor = (m, ctx) => m.slidingWindow ? Math.min(ctx, m.slidingWindow) : ctx;

// Steady-state GPU reservation, workspace included.
const gpuOf = (id, ctx) => {
  const m = modelOf(id);
  if (!m) return null;
  return m.paramsMB + m.kvPerTok * kvTokensFor(m, ctx) / 1e6 + OVERHEAD_MB + m.wsMB;
};

// Filled in by init() once the adapter is known.
let DEV = { mobile: false, f16: true, budgetMB: Infinity, maxBufMB: 0 };

// The context this page will actually ask for, chosen per device in init().
let CTX = 4096;

let sketchHistory = [];
let engine = null, history = [], generating = false, stopFlag = false;

// ---- Where the weights get stored ---------------------------------------
// WebLLM defaults to the Cache API. On some phones that fails in a way that is
// hard to read: `cache.add()` resolves, the entry is not there afterwards, and
// the only symptom is "Cannot fetch <url>" on a 2 KB config file — which looks
// like a network problem and is not one.
//
// So probe it before trusting it: round-trip one tiny entry, and fall back to
// the IndexedDB backend if that does not survive. Sticking with "cache" when it
// works matters, because the two backends cannot see each other's weights and
// switching means downloading everything again.
let APP = null;   // prebuilt model list + whichever backend survived the probe

async function pickCacheBackend() {
  const probe = "webllm-probe";
  try {
    if (typeof caches === "undefined") return "indexeddb";
    const c = await caches.open(probe);
    const url = new URL("./?probe", location.href).href;
    await c.put(new Request(url), new Response("ok"));
    const back = await c.match(new Request(url));
    await caches.delete(probe);
    if (!back) return "indexeddb";          // stored nothing, silently
    return (await back.text()) === "ok" ? "cache" : "indexeddb";
  } catch {
    return "indexeddb";                     // blocked storage, private mode
  }
}

const setStatus = (t, s) => { $("status").textContent = t; $("dot").className = "dot" + (s ? " " + s : ""); };

// Terminal: no WebGPU, no usable model. Nothing on the card would help.
function fail(html) {
  $("wrap").innerHTML = `<div class="err">${html}</div>`;
  setStatus("unavailable", "err");
}

// Recoverable: this load failed, but picking another model or trying again
// might work. Keep the card and its controls — replacing them left the page
// with no way forward except a reload.
function failSoft(html) {
  let box = $("loaderr");
  if (!box) {
    box = document.createElement("div");
    box.className = "err"; box.id = "loaderr";
    box.style.marginTop = "14px";
    $("card").appendChild(box);
  }
  box.innerHTML = html;
  setStatus("load failed", "err");
}

// ---- WebGPU is the hard requirement -------------------------------------
// navigator.gpu existing is NOT enough: on GPU-less VMs, headless browsers and
// blocklisted drivers the API is present but requestAdapter() yields null.
// Checking only the API lets the user get all the way to a confusing failure
// inside the engine, so resolve a real adapter up front.
const FALLBACK = "You can still use the Ollama version — see <code>scripts/serve-web.sh</code>.";

async function init() {
  if (!navigator.gpu) {
    fail("<b>This browser has no WebGPU.</b><br><br>" +
         "In-browser inference needs it. Chrome and Edge 113+ work today; Safari 18+ " +
         "and recent Firefox do too. Firefox ESR and older Safari do not.<br><br>" + FALLBACK);
    return;
  }
  let adapter = null;
  try { adapter = await navigator.gpu.requestAdapter(); } catch {}
  if (!adapter) {
    fail("<b>No GPU available to this browser.</b><br><br>" +
         "WebGPU is present but no adapter could be acquired — usually a headless " +
         "browser, a VM with no GPU passthrough, or a blocklisted driver. " +
         "Try <code>chrome://gpu</code> to see why.<br><br>" + FALLBACK);
    return;
  }

  APP = { ...webllm.prebuiltAppConfig, cacheBackend: await pickCacheBackend() };

  // ---- what can this device actually run? ----
  const uaMobile = /Android|iPhone|iPad|iPod|Mobile|Silk/i.test(navigator.userAgent);
  let coarse = false, narrow = false;
  try { coarse = matchMedia("(pointer: coarse)").matches; } catch {}
  try { narrow = Math.min(screen.width, screen.height) <= 820; } catch {}
  DEV.mobile = uaMobile || (coarse && narrow);

  // q4f16 / q0f16 builds need the shader-f16 feature; without it they fail.
  try { DEV.f16 = adapter.features.has("shader-f16"); } catch { DEV.f16 = false; }
  try { DEV.maxBufMB = Math.round((adapter.limits.maxBufferSize || 0) / 1e6); } catch {}

  // Phones kill the tab long before desktop does, so budget conservatively.
  DEV.budgetMB = DEV.mobile ? 900 : Infinity;
  if (navigator.deviceMemory) {
    DEV.budgetMB = Math.min(DEV.budgetMB, navigator.deviceMemory * 1024 * 0.45);
  }

  // fp16 builds need the shader-f16 adapter feature. Two signals, unioned,
  // because neither is sufficient alone: the id suffix catches models whose
  // record omits `required_features` (54 of them in 0.2.85, including every
  // Qwen3.5 build and gemma3), and `required_features` catches any future
  // requirement the suffix would not name.
  const needsF16 = id => {
    if (/q4f16|q0f16|q4bf16|q0bf16/.test(id)) return true;
    const rec = webllm.prebuiltAppConfig.model_list.find(m => m.model_id === id);
    return ((rec && rec.required_features) || []).includes("shader-f16");
  };
  const usable = MODELS.filter(m => DEV.f16 || !needsF16(m.id));
  if (!usable.length) {
    fail("<b>No compatible model for this device.</b><br><br>" +
         "It reports no <code>shader-f16</code> support, and no fp32 build is listed.<br><br>" + FALLBACK);
    return;
  }

  const safeMB = DEV.budgetMB * HEADROOM;

  // Largest context rung this model clears the budget at, or null if even the
  // smallest rung is too big.
  const bestCtxFor = id => CTX_LADDER.find(c => gpuOf(id, c) <= safeMB) ?? null;

  // Group by parameter scale so the ladder is legible, rather than leaving it
  // implied by ordering in one long list.
  for (let t = 0; t < TIERS.length; t++) {
    const inTier = usable.filter(m => m.tier === t);
    if (!inTier.length) continue;
    const g = document.createElement("optgroup");
    g.label = TIERS[t];
    for (const m of inTier) {
      const o = document.createElement("option");
      o.value = m.id;
      const ctx = bestCtxFor(m.id);
      o.textContent = `${m.label} · ${m.downloadMB + WASM_MB} MB download`;
      if (ctx === null) o.textContent += " · too big for this device";
      else if (ctx !== CTX_LADDER[0]) o.textContent += ` · ${ctx >= 1024 ? (ctx / 1024) + "k" : ctx} context`;
      g.appendChild(o);
    }
    $("model").appendChild(g);
  }

  // Phones get the smallest capable model; desktops get the one this repo is
  // built around. Both are validated against the budget with headroom to spare.
  const preferred = DEV.mobile
    ? ["SmolLM2-360M-Instruct-q4f16_1-MLC", "SmolLM2-360M-Instruct-q4f32_1-MLC"]
    : ["Qwen3-0.6B-q4f16_1-MLC", "SmolLM2-360M-Instruct-q4f16_1-MLC", "SmolLM2-360M-Instruct-q4f32_1-MLC"];

  const has = id => usable.some(m => m.id === id);
  let chosen = preferred.find(id => has(id) && bestCtxFor(id) !== null);
  if (!chosen) {
    // Nothing preferred fits — fall back to the largest that clears the
    // headroom at some rung, and failing that the smallest option we have.
    const fits = usable.filter(m => bestCtxFor(m.id) !== null);
    chosen = (fits.length ? fits[fits.length - 1] : usable[0]).id;
  }
  $("model").value = chosen;
  CTX = bestCtxFor(chosen) ?? CTX_LADDER[CTX_LADDER.length - 1];

  await refreshMeta();
  setStatus("ready to load");

  // Returning visitors already have the weights, so there is nothing to
  // consent to — open straight into chat. A first visit still asks, because
  // silently pulling hundreds of MB on someone's mobile data is not ours to do.
  try {
    if (await webllm.hasModelInCache($("model").value, APP)) {
      setStatus("loading from cache…", "busy");
      $("load").click();
    }
  } catch {}
}
init();

// ---- Cache + storage reporting ------------------------------------------
async function refreshMeta() {
  const id = $("model").value;
  let cached = false;
  try { cached = await webllm.hasModelInCache(id, APP); } catch {}

  const dl = downloadOf(id);
  const gpu = gpuOf(id, CTX);

  let quota = "";
  try {
    const e = await navigator.storage.estimate();
    if (e && e.usage != null) {
      quota = `<br><b>Browser storage used:</b> ${(e.usage / 1e6).toFixed(0)} MB` +
              (e.quota ? ` of ~${(e.quota / 1e9).toFixed(1)} GB available` : "");
    }
  } catch {}

  let persisted = false;
  try { persisted = await navigator.storage.persisted(); } catch {}

  // Too large for the device = the tab is killed with no catchable error.
  let toobig = "";
  if (gpu && gpu > DEV.budgetMB) {
    toobig = `<br><span style="color:#c0503f"><b>Too large for this device.</b> ` +
             `It needs ~${Math.round(gpu)} MB of GPU memory but this ` +
             `${DEV.mobile ? "phone" : "device"} can only be counted on for ` +
             `~${Math.round(DEV.budgetMB)} MB. Loading it will crash the tab ` +
             `rather than fail gracefully — pick a smaller model above.</span>`;
  }

  // A quota smaller than the DOWNLOAD means the transfer dies partway. This
  // used to compare against the GPU figure, which for Qwen3-0.6B overstated
  // the disk requirement by about a gigabyte.
  let tight = "";
  try {
    const e = await navigator.storage.estimate();
    if (e?.quota && dl && e.quota < dl * 1e6) {
      tight = `<br><span style="color:#c0503f">This browser only allows ` +
              `~${(e.quota / 1e6).toFixed(0)} MB of storage, which is less than ` +
              `the ${dl} MB this model downloads. Free up disk space or pick a ` +
              `smaller one.</span>`;
    }
  } catch {}

  const dev = `<br><b>Device:</b> ${DEV.mobile ? "phone/tablet" : "desktop"}` +
              `, fp16 ${DEV.f16 ? "yes" : "no"}` +
              (DEV.maxBufMB ? `, max buffer ${DEV.maxBufMB} MB` : "");

  // Say why the context is what it is. A window quietly reduced under the
  // visitor's feet reads as a broken page rather than a deliberate trade.
  const m = modelOf(id);
  const capped = m && m.slidingWindow && m.slidingWindow < CTX;
  const ctxNote = CTX === CTX_LADDER[0]
    ? `${CTX} tokens`
    : `${CTX} tokens — reduced to fit this device's memory`;

  $("meta").innerHTML =
    `<b>Weights cached here:</b> ${cached ? "yes — loads instantly, works offline" : "no — first load downloads them"}` +
    `<br><b>Download:</b> ${dl ? `~${dl} MB` : "unknown"}${cached ? " (already fetched)" : ""}` +
    `<br><b>GPU memory:</b> ~${gpu ? Math.round(gpu) : "?"} MB` +
    `<br><b>Context window:</b> ${ctxNote}` +
    (capped ? ` <span style="color:var(--muted)">(this model caps its cache at ${m.slidingWindow})</span>` : "") +
    (m && m.note ? `<br><span style="color:var(--muted)">${m.note}</span>` : "") +
    `<br><b>Eviction protection:</b> ${persisted ? "on" : "off (requested at load)"}` +
    dev + quota + tight + toobig;

  $("load").textContent = cached ? "Load model (cached)" : "Download & load model";
}
$("model").addEventListener("change", () => {
  const safeMB = DEV.budgetMB * HEADROOM;
  CTX = CTX_LADDER.find(c => gpuOf($("model").value, c) <= safeMB)
        ?? CTX_LADDER[CTX_LADDER.length - 1];
  if ($("loaderr")) $("loaderr").remove();
  refreshMeta();
});

// WebLLM merges mlc-chat-config.json, then ModelRecord.overrides, then these.
// Two things have to be said explicitly:
//
//   context_window_size  the rung chosen for this device. Without it every
//                        model loads at its record default of 4096.
//
//   sliding_window_size  WebLLM throws WindowSizeConfigurationError when both
//                        window settings are positive, and gemma3 ships a
//                        sliding window of 512 that its record never clears.
//                        That makes gemma3-1b-it fail to load at all — not a
//                        theory, it raises the error on a real load. The seven
//                        Mistral records clear it themselves; gemma3's does not.
function chatOptsFor(id) {
  const m = modelOf(id);
  const opts = { context_window_size: CTX };
  if (m && m.slidingWindow) opts.sliding_window_size = -1;
  return opts;
}

// ---- Load ----------------------------------------------------------------
$("load").addEventListener("click", async () => {
  const id = $("model").value;
  const need = gpuOf(id, CTX);
  if (need && need > DEV.budgetMB &&
      !confirm(`This model needs about ${Math.round(need)} MB of GPU memory at a ` +
               `${CTX}-token context, more than this device ` +
               `is likely to allow (~${Math.round(DEV.budgetMB)} MB).\n\n` +
               `The browser will probably kill the tab instead of showing an error.\n\n` +
               `Load it anyway?`)) {
    return;
  }
  $("load").disabled = true;
  $("model").disabled = true;
  $("bar").classList.add("on");
  setStatus("loading…", "busy");

  // Ask the browser not to evict the weights under storage pressure.
  try { await navigator.storage.persist(); } catch {}

  try {
    engine = await webllm.CreateMLCEngine(id, {
      appConfig: APP,
      initProgressCallback: r => {
        $("barfill").style.width = Math.round((r.progress || 0) * 100) + "%";
        setStatus(r.text ? r.text.slice(0, 60) : "loading…", "busy");
      }
    }, chatOptsFor(id));
    $("bar").classList.remove("on");
    $("wrap").innerHTML = "";
    $("foot").classList.add("on");
    fitPlaceholder();
    setStatus("ready — running locally", "on");
    $("input").focus();
  } catch (e) {
    $("bar").classList.remove("on");
    $("load").disabled = false;
    $("model").disabled = false;
    failSoft(await explainLoadFailure(e, id));
    const alt = $("swapstore");
    if (alt) alt.addEventListener("click", () => {
      // The probe only proves a tiny entry round-trips; a real model can still
      // fail on the same backend. Offer the other one rather than switching
      // silently, because the two cannot see each other's weights and a swap
      // means downloading again.
      APP = { ...APP, cacheBackend: APP.cacheBackend === "cache" ? "indexeddb" : "cache" };
      $("loaderr").remove();
      $("load").click();
    });
  }
});

// "Cannot fetch <url>" is WebLLM's message when a file went into the browser
// store and was not there afterwards. It reads like a network failure and
// almost never is one: the usual cause is the store being full or unavailable,
// and the file it names is often a 2 KB config rather than the weights. Say
// that, with the numbers, instead of forwarding the raw string.
async function explainLoadFailure(e, id) {
  const msg = String(e && e.message || e);
  let est = null;
  try { est = await navigator.storage.estimate(); } catch {}

  const used = est && est.usage != null ? (est.usage / 1e6).toFixed(0) + " MB" : "unknown";
  const cap  = est && est.quota ? (est.quota / 1e6).toFixed(0) + " MB" : "unknown";
  const need = downloadOf(id);
  const free = est && est.quota != null && est.usage != null
    ? (est.quota - est.usage) / 1e6 : null;

  let head = "<b>Could not load the model.</b>";
  let why = "";

  if (/Cannot fetch|QuotaExceeded|quota|Failed to execute 'add' on 'Cache'/i.test(msg)) {
    head = "<b>This browser would not store the model.</b>";
    why = "<br><br>The download itself is reachable — the file it names below is " +
          "usually a small config, not the weights. What failed is writing it into " +
          "this browser's storage." +
          `<br><br><b>Storage used:</b> ${used} of ${cap}` +
          (free !== null ? ` — about ${Math.max(0, free).toFixed(0)} MB free` : "") +
          (need ? `<br><b>This model needs:</b> ~${need} MB` : "") +
          `<br><b>Backend in use:</b> ${APP && APP.cacheBackend}` +
          "<br><br><b>Things that fix it, in order:</b><br>" +
          "· <b>Clear cache</b> in the header — it now removes every model, not " +
          "just this one, so a half-finished download from a previous attempt goes too.<br>" +
          "· Free up space on the device; browsers shrink this allowance when the " +
          "disk is nearly full.<br>" +
          "· Leave private/incognito browsing, which caps or forbids this storage.<br>" +
          "· Try a smaller model — the download size is on every option." +
          `<br><br><button id="swapstore">Retry using ` +
          `${APP && APP.cacheBackend === "cache" ? "IndexedDB" : "the Cache API"} instead</button>`;
  }
  return head + why + `<br><br><code>${msg}</code>`;
}

// Clearing only the selected model is not much use once the list is 15 long:
// what fills the store is usually something you tried earlier, or a download
// that died halfway. Clear everything the page could have written.
$("evict").addEventListener("click", async () => {
  if (!confirm("Remove all cached model weights from this browser?\n\n" +
               "They will download again next time.")) return;
  const errs = [];
  for (const m of MODELS) {
    try { await webllm.deleteModelAllInfoInCache(m.id, APP); }
    catch (e) { errs.push(m.id); }
  }
  // Anything WebLLM missed, and the other backend's leftovers.
  try {
    for (const k of await caches.keys()) if (/^webllm/.test(k)) await caches.delete(k);
  } catch {}
  engine = null; history = [];
  if (errs.length === MODELS.length) alert("Could not clear the cache.");
  location.reload();
});

// ---- Presets --------------------------------------------------------------
// SmolLM2-360M scored 10/10 on realistic journal entries, where Llama-3.2-1B
// managed 4/10 because it drifted off-format. Small models obey tight
// constraints well; they reason badly. Temperature 0 keeps it deterministic,
// and one-message-at-a-time stops earlier turns from skewing the label.
const PRESETS = {
  chat:    { system: "", temp: 0.7, single: false },
  concise: { system: "Answer in at most two short sentences.", temp: 0.5, single: false }
};

const HINTS = {
  chat: "",
  concise: "Small models ramble; this keeps answers short.",
  custom: ""
};

const MODE_LABEL = { concise: "concise", custom: "custom prompt" };

function syncBadge() {
  const name = $("preset").value;
  $("mode").hidden = name === "chat";
  $("mode").textContent = MODE_LABEL[name] || "";
}

function applyPreset(name) {
  const cfg = PRESETS[name];
  if (cfg) {
    $("system").value = cfg.system;
    $("temp").value = cfg.temp;
    $("single").checked = cfg.single;
  }
  $("hint").textContent = HINTS[name] || "";
  syncBadge();
  save();
}

function save() {
  try {
    localStorage.setItem("sketchgpt.cfg", JSON.stringify({
      preset: $("preset").value, system: $("system").value,
      temp: $("temp").value, single: $("single").checked,
      think: $("think").checked, output: $("output").value
    }));
  } catch {}
}

function restore() {
  let c = null;
  try { c = JSON.parse(localStorage.getItem("sketchgpt.cfg") || "null"); } catch {}
  if (c) {
    $("preset").value = c.preset || "chat";
    $("system").value = c.system || "";
    $("temp").value = c.temp != null ? c.temp : 0.7;
    $("single").checked = !!c.single;
    $("think").checked = !!c.think;
    $("output").value = c.output === "sketch" ? "sketch" : "chat";
    $("hint").textContent = HINTS[$("preset").value] || "";
    syncBadge();
  } else {
    applyPreset("chat");
  }
}

$("preset").addEventListener("change", () => applyPreset($("preset").value));
// Hand-editing the prompt means it is no longer one of the presets.
for (const id of ["system", "temp", "single"]) {
  $(id).addEventListener("input", () => {
    const cur = PRESETS[$("preset").value];
    if (cur && ($("system").value !== cur.system ||
                parseFloat($("temp").value) !== cur.temp ||
                $("single").checked !== cur.single)) {
      $("preset").value = "custom";
      $("hint").textContent = "";
      syncBadge();
    }
    save();
  });
}
$("toggle").addEventListener("click", () => $("settings").classList.toggle("open"));
$("mode").addEventListener("click", () => $("settings").classList.add("open"));
$("mode").style.cursor = "pointer";
$("mode").title = "Constrained mode — tap to change";
restore();
$("output").addEventListener("change", () => { save(); fitPlaceholder(); });

// ---- Rendering model output ----------------------------------------------
// Small models emit Markdown and LaTeX whether or not you ask for it, so a
// plain-text pane shows people raw `**bold**` and \frac{}{} and reads as
// broken. This renders both.
//
// The rule that keeps it safe: **escape first, then format**. Model output is
// never inserted as HTML. Everything is HTML-escaped up front, and the only
// tags that reach the DOM are ones this code adds itself. A model that emits
// `<script>` gets it rendered as visible text, which is the correct outcome.
//
// KaTeX is loaded from the same CDN as WebLLM, lazily, on the first message
// that actually contains maths. If it fails to load the page keeps working and
// formulas fall back to their source text, which is still readable.
const KATEX_VER = "0.18.7";
let katexReady = null;

function loadKatex() {
  if (katexReady) return katexReady;
  katexReady = new Promise(resolve => {
    const base = `https://cdn.jsdelivr.net/npm/katex@${KATEX_VER}/dist/katex.min`;
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = base + ".css";
    document.head.appendChild(css);
    const js = document.createElement("script");
    js.src = base + ".js";
    js.onload = () => resolve(true);
    js.onerror = () => resolve(false);   // degrade to source text, never throw
    document.head.appendChild(js);
  });
  return katexReady;
}

const esc = t => t.replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Pull spans out before escaping/formatting so Markdown cannot chew through
// LaTeX (subscripts are `_`, which is also emphasis) and vice versa.
function extract(text, re, store, kind, keep) {
  return text.replace(re, (...m) => {
    if (keep && !keep(m[1])) return m[0];   // not ours — hand the text back intact
    store.push({ kind, groups: m });
    return `\u0000${store.length - 1}\u0000`;
  });
}

// Is what sits between two `$` actually a formula, or is it "$5 and $10"?
// `$$…$$`, `\[…\]` and `\(…\)` are unambiguous; the single-dollar form is not,
// so it has to be judged on content. Two things count as a formula:
//   - LaTeX markup: a control sequence, a sub/superscript, or braces
//   - plain algebra: letters and numbers joined by an operator, kept short
// "5 and " has neither, so prices survive. Note that models routinely pad the
// delimiters — `$ \frac{a}{b} $` — so inner spaces must be allowed, which is
// why this cannot simply be a whitespace rule.
const isFormula = c => {
  const t = c.trim();
  if (!t) return false;
  if (/[\\^_{}]/.test(t)) return true;
  // A lone symbol — $v$, $c$, $E$ — is the commonest inline formula of all and
  // has no operator to detect. Require a letter first so "$5" stays a price.
  if (/^[A-Za-z][A-Za-z0-9]{0,2}$/.test(t)) return true;
  return t.length <= 60 &&
         /^[A-Za-z0-9\s+\-*/=<>().,:;|']+$/.test(t) &&
         /[+\-*/=<>]/.test(t);
};

function renderMarkdown(src) {
  const held = [];
  let t = src;

  // 1. Code first — nothing inside a code span is Markdown or maths.
  t = extract(t, /```(\w*)\n?([\s\S]*?)```/g, held, "fence");
  t = extract(t, /`([^`\n]+)`/g, held, "code");

  // 2. Maths. $$…$$ and \[…\] are display; $…$ and \(…\) are inline.
  //    The $…$ form requires non-space just inside the delimiters, so prices
  //    like "$5 and $10" are not swallowed as a formula.
  t = extract(t, /\$\$([\s\S]+?)\$\$/g, held, "display");
  t = extract(t, /\\\[([\s\S]+?)\\\]/g, held, "display");
  t = extract(t, /\$((?:[^$\n]|\n(?!\n))+?)\$/g, held, "inline", isFormula);
  t = extract(t, /\\\(([\s\S]+?)\\\)/g, held, "inline");

  // 3. Everything that survives is untrusted text.
  t = esc(t);

  // 4. Block structure, then inline emphasis.
  const lines = t.split("\n");
  const out = [];
  let list = null;
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };

  for (let line of lines) {
    // A bare "###" with nothing after it is how a truncated answer ends. It is
    // not a heading and it is not prose; drop it rather than printing it.
    if (/^\s*#{1,6}\s*$/.test(line)) { closeList(); continue; }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    const quote = line.match(/^&gt;\s?(.*)$/);

    if (h)            { closeList(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); }
    else if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { closeList(); out.push("<hr>"); }
    else if (ul)      { if (list !== "ul") { closeList(); out.push("<ul>"); list = "ul"; }
                        out.push(`<li>${inline(ul[1])}</li>`); }
    else if (ol)      { if (list !== "ol") { closeList(); out.push("<ol>"); list = "ol"; }
                        out.push(`<li>${inline(ol[1])}</li>`); }
    else if (quote)   { closeList(); out.push(`<blockquote>${inline(quote[1])}</blockquote>`); }
    else if (!line.trim()) { closeList(); out.push(""); }
    else {
      closeList();
      // A line that is nothing but a code block or a display formula is
      // block-level already; wrapping it in <p> is invalid HTML and the
      // browser silently splits it into empty paragraphs.
      const solo = line.trim().match(/^\u0000(\d+)\u0000$/);
      const kind = solo && held[+solo[1]].kind;
      out.push(kind === "fence" || kind === "display"
        ? line.trim()
        : `<p>${inline(line)}</p>`);
    }
  }
  closeList();
  t = out.join("\n").replace(/\n{3,}/g, "\n\n");

  // 5. Put the held spans back, rendered.
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => {
    const h = held[+i];
    if (h.kind === "fence") {
      const lang = h.groups[1] ? ` data-lang="${esc(h.groups[1])}"` : "";
      return `<pre${lang}><code>${esc(h.groups[2].replace(/\n$/, ""))}</code></pre>`;
    }
    if (h.kind === "code") return `<code>${esc(h.groups[1])}</code>`;
    return math(h.groups[1], h.kind === "display");
  });
}

// Emphasis, links and stray inline code, applied to already-escaped text.
function inline(t) {
  return t
    .replace(/\*\*\*([^*]+)\*\*\*/g, "<strong><em>$1</em></strong>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, "$1<em>$2</em>")
    .replace(/(^|\W)_([^_\n]+)_(?=\W|$)/g, "$1<em>$2</em>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    // Links: the href is rebuilt from an allow-list of schemes, never echoed.
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, href) =>
      /^(https?:|mailto:)/i.test(href)
        ? `<a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${label}</a>`
        : `${label} (${esc(href)})`);
}

// KaTeX if it loaded, otherwise the source, which is what a formula looked
// like in the terminal anyway.
// Small models drop closing braces routinely — `\frac{a}{\sqrt{b)}` was in a
// real answer. Count unescaped braces and close what is open; it is the one
// repair that recovers the model's evident intent without inventing content.
function balanceBraces(src) {
  let depth = 0;
  for (let i = 0; i < src.length; i++) {
    if (src[i] === "\\") { i++; continue; }        // escaped, skip the pair
    if (src[i] === "{") depth++;
    else if (src[i] === "}") depth--;
  }
  return depth > 0 ? src + "}".repeat(depth) : src;
}

function math(src, display) {
  const raw = src.trim();
  if (!window.katex) return `<code class="tex">${esc(raw)}</code>`;

  const opts = { displayMode: display, throwOnError: true, trust: false,
                 strict: false, output: "html" };
  // As written, then with braces closed, then give up.
  for (const attempt of [raw, balanceBraces(raw)]) {
    try { return window.katex.renderToString(attempt, opts); } catch {}
    if (attempt === balanceBraces(raw)) break;
  }
  // KaTeX's own error styling is red and alarming, which puts the blame on the
  // page rather than on the model that emitted broken LaTeX. Show the source
  // quietly instead — it is what the answer said.
  return `<code class="tex" title="This formula could not be parsed">${esc(raw)}</code>`;
}

const hasMath = t =>
  /\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)/.test(t) ||
  [...t.matchAll(/\$([^$\n]+?)\$/g)].some(m => isFormula(m[1]));

// While tokens are still arriving the Markdown and the delimiters are both
// half-finished, so streaming renders as plain text and the rich pass runs
// once the message is complete. One reflow at the end beats formatting that
// flickers as it is typed.
async function paint(el, text) {
  if (hasMath(text)) await loadKatex();
  el.innerHTML = renderMarkdown(text);
  el.classList.add("rich");
}

// ---- Chat ----------------------------------------------------------------
function addMsg(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.innerHTML = `<div class="who">${role === "user" ? "you" : "sketchgpt"}</div>`;
  const think = document.createElement("div");
  think.className = "think"; think.style.display = "none";
  const body = document.createElement("div");
  body.className = "body"; body.textContent = text || "";
  el.append(think, body);
  $("wrap").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
  return { body, think };
}

// Qwen3 emits reasoning inside <think>…</think>. Chat templates commonly
// PREFILL the opening tag, so the stream often carries only the closing one —
// treating a missing "<think>" as "no reasoning here" dumped the entire
// monologue into the answer. Handle both shapes.
function splitThink(raw) {
  const open  = raw.indexOf("<think>");
  const close = raw.indexOf("</think>");

  if (open === -1) {
    if (close === -1) return { think: "", answer: raw };      // no reasoning
    // Opening tag was prefilled: everything up to </think> is reasoning.
    return { think: raw.slice(0, close), answer: raw.slice(close + 8) };
  }
  return close === -1
    ? { think: raw.slice(open + 7), answer: "" }               // still thinking
    : { think: raw.slice(open + 7, close), answer: raw.slice(close + 8) };
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text || !engine || generating) return;
  $("input").value = ""; $("input").style.height = "auto";

  const sketching = $("output").value === "sketch";
  const conversation = sketching ? sketchHistory : history;
  addMsg("user", text);
  conversation.push({ role: "user", content: text });
  const out = addMsg("assistant", "");

  generating = true; stopFlag = false;
  $("send").disabled = true; $("stop").style.display = "";
  setStatus("generating…", "busy");

  let raw = "";
  if (sketching) out.body.textContent = "Drawing…";
  try {
    // One-at-a-time sends just this turn: for classification, earlier turns
    // bias the answer rather than help it. Clone so wrapping cannot corrupt
    // the stored history.
    const preset = PRESETS[$("preset").value];
    let base = ($("single").checked ? [conversation[conversation.length - 1]] : conversation)
                 .map(m => ({ ...m }));

    if (preset && preset.wrap && base.length && base[base.length - 1].role === "user") {
      base[base.length - 1].content = preset.wrap(base[base.length - 1].content);
    }
    const sys = $("system").value.trim();
    if (sketching) base.unshift({ role: "system", content: SKETCH_PROMPT + (sys ? "\nStyle preference: " + sys : "") });
    else if (sys) base.unshift({ role: "system", content: sys });

    const temp = parseFloat($("temp").value);
    const req = { messages: base, stream: true };
    if (!isNaN(temp)) req.temperature = temp;

    // Reasoning models otherwise spend most of their output budget thinking
    // out loud before the answer. Off by default; the block is collapsed when on.
    if (sketching || !$("think").checked) req.extra_body = { enable_thinking: false };

    // Single-turn means a short structured answer is expected, so cap the
    // output. Without this a model that loops emits a wall of repeated text.
    const cap = preset && preset.maxTokens ? preset.maxTokens
              : ($("single").checked ? 12 : 0);
    if (sketching) {
      req.max_tokens = Math.min(1200, Math.floor(CTX / 2));
      req.temperature = 0.2;
      req.response_format = { type: "json_object", schema: SKETCH_SCHEMA };
    } else if (cap) req.max_tokens = cap;

    let stream;
    try {
      stream = await engine.chat.completions.create(
        preset && preset.grammar
          ? { ...req, response_format: { type: "grammar", grammar: preset.grammar } }
          : req);
    } catch (e) {
      // Grammar support varies by model build; fall back rather than break chat.
      if (!(preset && preset.grammar)) throw e;
      console.warn("grammar constraint rejected, retrying without:", e.message);
      stream = await engine.chat.completions.create(req);
    }
    for await (const chunk of stream) {
      if (stopFlag) { await engine.interruptGenerate(); break; }
      raw += chunk.choices?.[0]?.delta?.content || "";
      const { think, answer } = splitThink(raw);
      if (think && !sketching) { out.think.style.display = ""; out.think.textContent = think.trim(); }
      if (!sketching) out.body.textContent = answer.trim();
      $("log").scrollTop = $("log").scrollHeight;
    }
    // Now the message is whole, format it.
    let done = sketching ? raw.trim() : splitThink(raw).answer.trim();
    if (sketching && stopFlag) {
      out.body.textContent = "Drawing stopped. Try again with fewer details.";
      conversation.pop();
      setStatus("ready — running locally", "on");
      return;
    }
    if (sketching) done = renderSketch(out.body, done);
    else await paint(out.body, done);
    $("log").scrollTop = $("log").scrollHeight;
    conversation.push({ role: "assistant", content: done });
    setStatus("ready — running locally", "on");
  } catch (err) {
    out.body.textContent = sketching
      ? (stopFlag ? "Drawing stopped." : "Could not finish a valid sketch. Try a simpler request or a larger model. " + err.message)
      : "Generation failed: " + err.message;
    conversation.pop();
    setStatus(stopFlag ? "ready — running locally" : "error", stopFlag ? "on" : "err");
  } finally {
    generating = false;
    $("send").disabled = false; $("stop").style.display = "none";
    $("input").focus();
  }
});

$("stop").addEventListener("click", () => { stopFlag = true; engine?.interruptGenerate(); });
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
$("input").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 180) + "px";
});

// "Enter to send, Shift+Enter for newline" is advice for a physical keyboard,
// and the full string wraps to two lines in a narrow composer — where rows="1"
// then clips it, which reads as a broken input. On a touch screen it is also
// simply wrong, since the on-screen Return key inserts a newline.
//
// The fit has to be measured while the composer is VISIBLE: a display:none
// element reports scrollHeight 0, so checking at startup always "fits".
const PLACEHOLDER_FULL  = "Send a message…  (Enter to send, Shift+Enter for newline)";
const PLACEHOLDER_SHORT = "Send a message…";

function fitPlaceholder() {
  const el = $("input");
  if ($("output").value === "sketch") { el.placeholder = "Describe a sketch…"; return; }
  if (!matchMedia("(pointer: fine)").matches) { el.placeholder = PLACEHOLDER_SHORT; return; }
  if (el.value || !$("foot").classList.contains("on")) return;  // nothing to measure
  el.placeholder = PLACEHOLDER_FULL;
  if (el.scrollHeight > el.clientHeight + 1) el.placeholder = PLACEHOLDER_SHORT;
}
addEventListener("resize", fitPlaceholder);
</script>
</body>
</html>
